[package]
name = "andysu-cli"
description = "AndySU command line: keygen, init, split, pack, sign, diff, publish, verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "andysu"
path = "src/main.rs"

[dependencies]
andysu-core = { path = "../core", version = "0.1.0", registry = "andysu", features = ["transport", "ffi"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
getrandom = "0.2"
url = "2.5"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
