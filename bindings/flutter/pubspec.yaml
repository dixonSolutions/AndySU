name: andysu
description: AndySU self-updates for Flutter apps on Android (status, check, apply, apply policy).
version: 0.1.0
repository: https://github.com/dixonSolutions/AndySU/tree/main/bindings/flutter
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.andysu.flutter
        pluginClass: AndySUPlugin
