[package]
name = "andysu-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
andysu-core = { path = ".." }
serde_json = "1"

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "verify_and_parse"
path = "fuzz_targets/verify_and_parse.rs"
test = false
doc = false

[[bin]]
name = "parse_manifest"
path = "fuzz_targets/parse_manifest.rs"
test = false
doc = false
