[package]
name = "andysu-core"
description = "AndySU sans-IO core: signature and hash verification, release selection, patching, safe extraction and the slot state machine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# C ABI (JSON in, JSON out). Header generated by cbindgen into core/include/andysu.h.
ffi = []
# JNI entry points for the Android host (com.andysu.host.Core).
jni = ["ffi", "dep:jni"]
# Optional blocking HTTP transport for C and desktop apps. The core itself never does networking.
transport = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zstd = { version = "0.13", default-features = false }
qbsdiff = "1.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
url = "2.5"
jni = { version = "0.21", optional = true, default-features = false }
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
jsonschema = { version = "0.26", default-features = false }
