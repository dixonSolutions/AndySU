language = "C"
include_guard = "ANDYSU_H"
autogen_warning = "/* Generated by cbindgen from core/src/ffi.rs. Do not edit; run scripts/gen-header.sh. */"
header = """
/*
 * AndySU core C ABI. Strings are UTF-8 and NUL-terminated. Every function except
 * andysu_version and andysu_session_free returns a heap-allocated JSON string,
 * {"ok": ...} or {"error": {"code": "...", "message": "..."}}, to be freed with andysu_free.
 */"""
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = true
usize_is_size_t = true
[defines]
"feature = transport" = "ANDYSU_TRANSPORT"
[parse]
parse_deps = false
[export]
item_types = ["functions"]
