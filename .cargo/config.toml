# Android 15+ devices may use 16 KB pages: align LOAD segments of every Android library to 16 KB.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# AndySU's own crate registry (static sparse index on GitHub Pages; see docs/REGISTRIES.md).
[registries.andysu]
index = "sparse+https://dixonsolutions.github.io/AndySU/cargo/"
