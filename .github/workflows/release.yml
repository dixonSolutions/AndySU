# Every push to main is a release: run all tests, then publish to our own GitHub remote.
#
#   GitHub Release v<version>   CLI binaries, AARs, crates, npm/pub tarballs, C and Godot
#                               archives, host template, SHA256SUMS + detached signature
#   GitHub Pages (gh-pages)     static registries: maven/ npm/ cargo/ pub/ (scripts/registry.py)
#   Formula/andysu.rb on main   Homebrew tap (this repository)
#
# Then every package is installed from those URLs by fresh consumer projects.
#
# Secrets (docs/KEYS.md; set with scripts/setup-secrets.sh).
#   ANDYSU_SIGNING_KEY          certified production release key signs SHA256SUMS
#   ANDYSU_SIGNING_CERT         required root certificate for that release key
#   ANDYSU_DEMO_SIGNING_KEY     certified production release key signs the demo channel
#   ANDYSU_DEMO_SIGNING_CERT    required certificate for that release key
# Public registry publishing uses OIDC. Set repository variables PUBLISH_CRATES_IO=true and/or
# PUBLISH_NPMJS=true only after configuring the trusted publisher on every package.
# crates.io requires an initial manual publish before its trusted publisher can be configured.
name: release
on:
  push:
    branches: [main]
    # A merge that only touches documentation is not a release.
    paths-ignore: ["docs/**", "docs-site/**", "**/*.md", "testbeds/patches/**/*.md"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PAGES_URL: https://dixonsolutions.github.io/AndySU

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

  cli:
    needs: [version]
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest, zig: false }
          - { target: aarch64-apple-darwin, os: macos-latest, zig: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: scripts/set-version.sh "${{ needs.version.outputs.version }}"
      - if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release -p andysu-cli --target ${{ matrix.target }}
      - if: ${{ !matrix.zig }}
        run: cargo build --release -p andysu-cli --target ${{ matrix.target }}
      - run: |
          mkdir -p dist/cli
          cp target/${{ matrix.target }}/release/andysu dist/cli/andysu-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/*

  package:
    needs: [test, version, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install cargo-ndk --locked && (python3 -c "import yaml" || sudo apt-get install -y python3-yaml)
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - run: scripts/set-version.sh "${{ needs.version.outputs.version }}"
      - name: Earlier releases (the gh-pages branch)
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site
          else
            mkdir site
          fi
      - run: scripts/package.sh site "$PAGES_URL"
      - name: Demo channel (the Compose sample on Pages; its host APK goes into the release)
        env:
          ANDYSU_DEMO_SIGNING_KEY: ${{ secrets.ANDYSU_DEMO_SIGNING_KEY }}
          ANDYSU_DEMO_SIGNING_CERT: ${{ secrets.ANDYSU_DEMO_SIGNING_CERT }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          : "${ANDYSU_DEMO_SIGNING_KEY:?ANDYSU_DEMO_SIGNING_KEY is required for the legacy demo channel}"
          printf '%s\n' "$ANDYSU_DEMO_SIGNING_KEY" > "$RUNNER_TEMP/demo.key"
          export ANDYSU_KEY_FILE="$RUNNER_TEMP/demo.key"
          if [ -n "$ANDYSU_DEMO_SIGNING_CERT" ]; then
            printf '%s\n' "$ANDYSU_DEMO_SIGNING_CERT" > "$RUNNER_TEMP/demo.cert.json"
            export ANDYSU_CERT_FILE="$RUNNER_TEMP/demo.cert.json"
          fi
          export ANDYSU_ROOT_PUB=keys/andysu-release-root-public.pem
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/demo.jks"
            printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/demo.jks.pass"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/demo.jks" ANDROID_KEYSTORE_PASS_FILE="$RUNNER_TEMP/demo.jks.pass"
            export ANDROID_KEY_ALIAS
          fi
          umask 022
          scripts/demo.sh site "$PAGES_URL" "${{ needs.version.outputs.version }}" dist/release
          rm -f "$RUNNER_TEMP"/demo.*
      - name: Checksums, signed by the certified production release key
        env:
          ANDYSU_SIGNING_KEY: ${{ secrets.ANDYSU_SIGNING_KEY }}
          ANDYSU_SIGNING_CERT: ${{ secrets.ANDYSU_SIGNING_CERT }}
        run: |
          : "${ANDYSU_SIGNING_KEY:?ANDYSU_SIGNING_KEY is required}"
          : "${ANDYSU_SIGNING_CERT:?ANDYSU_SIGNING_CERT is required}"
          cargo build -q --release -p andysu-cli
          cp dist/cli/* dist/release/
          umask 077
          printf '%s\n' "$ANDYSU_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          cert=""
          if [ -n "$ANDYSU_SIGNING_CERT" ]; then
            printf '%s\n' "$ANDYSU_SIGNING_CERT" > "$RUNNER_TEMP/signing.cert.json"
            cert="--cert $RUNNER_TEMP/signing.cert.json"
          fi
          cd dist/release
          sha256sum * > SHA256SUMS
          ../../target/release/andysu sign-file SHA256SUMS --key "$RUNNER_TEMP/signing.key" $cert
          cp ../../keys/andysu-release-root-public.pem andysu-release-public.pem
          rm -f "$RUNNER_TEMP/signing.key"
          ../../target/release/andysu verify-file SHA256SUMS --pub ../../keys/andysu-release-root-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true

  github-release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" dist/* \
            --title "AndySU ${{ needs.version.outputs.version }}" \
            --notes "Automated release of ${{ github.sha }}. Packages: $PAGES_URL (docs/REGISTRIES.md)."

  pages:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Push the registries to gh-pages
        run: |
          cd site
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Registries for ${{ needs.version.outputs.version }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
      - name: Wait for Pages to serve this version
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$PAGES_URL/npm/com.andysu.unity" | grep -q '"${{ needs.version.outputs.version }}"'; then
              echo "live"; exit 0
            fi
            sleep 10
          done
          echo "::error::Pages did not serve ${{ needs.version.outputs.version }} within 10 minutes"; exit 1

  homebrew:
    needs: [version, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Update Formula/andysu.rb on main ([skip ci]; pushes with the workflow token start no runs)
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r dist "$RUNNER_TEMP/dist"
          # Regenerate on a fresh main each attempt (no rebase of a stale formula), and never
          # replace a newer release's formula with an older one.
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -B formula origin/main
            cur=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/andysu.rb 2>/dev/null || true)
            if [ -n "$cur" ] && [ "$(printf '%s\n%s\n' "$cur" "$V" | sort -V | tail -1)" != "$V" ]; then
              echo "Formula already at $cur (newer than $V)"; exit 0
            fi
            mkdir -p Formula
            scripts/homebrew-formula.sh "$V" "$RUNNER_TEMP/dist" > Formula/andysu.rb
            git add Formula/andysu.rb
            git diff --cached --quiet && { echo "Formula unchanged"; exit 0; }
            git commit -q -m "Homebrew: andysu $V [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  verify:
    # Consumer verification: fresh projects install every package from our remote.
    needs: [version, github-release, pages]
    strategy:
      fail-fast: false
      matrix:
        eco: [cargo, npm, upm, maven, pub, c, godot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.eco == 'cargo'
      - uses: actions/setup-java@v4
        if: matrix.eco == 'maven'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        if: matrix.eco == 'npm' || matrix.eco == 'upm'
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        if: matrix.eco == 'pub'
        with:
          channel: stable
      - run: >-
          scripts/verify-consumers.sh "$PAGES_URL" "${{ needs.version.outputs.version }}"
          "https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}"
          ${{ matrix.eco }}

  verify-homebrew:
    needs: [version, homebrew]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: |
          brew tap dixonsolutions/andysu https://github.com/${{ github.repository }}
          brew install dixonsolutions/andysu/andysu
          andysu --version | grep -q "${{ needs.version.outputs.version }}"

  verify-signature:
    needs: [version, github-release, pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the release and check SHA256SUMS against the production root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir r && cd r
          gh release download "v${{ needs.version.outputs.version }}" --repo "${{ github.repository }}"
          sha256sum -c --ignore-missing SHA256SUMS
          chmod +x andysu-x86_64-unknown-linux-musl
          ./andysu-x86_64-unknown-linux-musl verify-file SHA256SUMS --pub ../keys/andysu-release-root-public.pem
      - name: The live demo channel verifies like a client would (signature, expiry, every blob)
        run: >-
          r/andysu-x86_64-unknown-linux-musl verify "$PAGES_URL/demo/stable/update.json"
          --pub keys/andysu-release-root-public.pem --app com.andysu.sample.compose --blobs

  # Optional public registries. Explicit repository variables gate all OIDC requests and publishes.
  # crates.io trusted publisher identity: owner=dixonSolutions, repo=AndySU, workflow=release.yml.
  crates-io:
    needs: [version, verify]
    if: vars.PUBLISH_CRATES_IO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set release version and prepare crates.io dependency metadata
        run: |
          scripts/set-version.sh "${{ needs.version.outputs.version }}"
          sed -i 's/, registry = "andysu"//' cli/Cargo.toml
      - name: Authenticate for the core crate
        id: crates-auth-core
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish core before CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth-core.outputs.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          if ! curl -fsS https://index.crates.io/an/dy/andysu-core | grep -F '"vers":"'"$V"'"' >/dev/null; then
            cargo publish -p andysu-core --allow-dirty
          else
            echo "andysu-core $V is already published; skipping"
          fi
      - name: Wait for the core version to appear in the crates.io index
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS https://index.crates.io/an/dy/andysu-core | grep -F '"vers":"'"$V"'"' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "andysu-core $V did not appear in the crates.io index" >&2
          exit 1
      - name: Authenticate for the CLI crate
        id: crates-auth-cli
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish CLI after its core dependency is indexed
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth-cli.outputs.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          if ! curl -fsS https://index.crates.io/an/dy/andysu-cli | grep -F '"vers":"'"$V"'"' >/dev/null; then
            cargo publish -p andysu-cli --allow-dirty
          else
            echo "andysu-cli $V is already published; skipping"
          fi
      - name: Verify a fresh cargo install from crates.io
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          for i in $(seq 1 12); do
            if CARGO_HOME="$work/cargo-home" cargo install andysu-cli --version "=$V" --locked --root "$work/install"; then
              break
            fi
            [ "$i" -lt 12 ] || exit 1
            sleep 10
          done
          "$work/install/bin/andysu" --version | grep -F "$V"

  # npm trusted publisher identity: owner=dixonSolutions, repo=AndySU, workflow=release.yml.
  npmjs:
    needs: [version, verify]
    if: vars.PUBLISH_NPMJS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.15.0
          node --version
          npm --version
          node -e 'const [a,b,c]=process.versions.node.split(".").map(Number); if(a<22 || (a===22 && b<14)) process.exit(1)'
          test "$(npm --version)" = 11.15.0
      - name: Publish npm packages and Unity package through OIDC
        env:
          V: ${{ needs.version.outputs.version }}
        run: scripts/publish-npmjs.sh "$V" dist/*.tgz
      - name: Verify installation from the public npm registry in a fresh consumer
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          npm init -y >/dev/null
          for i in $(seq 1 12); do
            if npm install --no-audit --no-fund --registry=https://registry.npmjs.org \
              "andysu-react-native@$V" "andysu-capacitor@$V" "andysu@$V" "com.andysu.unity@$V"; then
              break
            fi
            [ "$i" -lt 12 ] || exit 1
            sleep 10
          done
          node -e 'for(const p of ["andysu-react-native","andysu-capacitor"]) require.resolve(p); const u=require("./node_modules/com.andysu.unity/package.json"); if(u.version!==process.env.V) throw Error(`Unity package version ${u.version}`);'
          ./node_modules/.bin/andysu --version | grep -F "$V"
