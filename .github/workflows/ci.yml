# Tests on every pull request (all work reaches main through PRs). Pushes to main run
# release.yml instead, which runs these same jobs before publishing.
name: ci
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "testbeds/patches/**/*.md"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features andysu-core/jni,andysu-core/transport -- -D warnings
      - run: cargo test --workspace
      - name: The publish action (pages and github remotes, against local stand-ins)
        run: cargo build -p andysu-cli && bash actions/publish/test.sh
      - name: The remote template (ingest, promote, rollout, rollback, re-sign)
        run: bash templates/remote/test.sh
      - name: C header is up to date
        run: |
          cargo install cbindgen --locked --version 0.29.4
          scripts/gen-header.sh
          git diff --exit-code core/include/andysu.h

  desktop-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make -C desktop test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cargo install cargo-ndk --locked
      - name: Build the host AAR for all ABIs, the API and the test APKs
        working-directory: android
        run: ./gradlew :api:assembleRelease :host:assembleRelease :payload-kit:assembleRelease --stacktrace

  android-devices:
    # The same driver as local runs (android/tests/device_tests.py) against CI emulators.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 24, target: default }
          - { api: 29, target: default }
          - { api: 31, target: aosp_atd }
          - { api: 34, target: aosp_atd }
          - { api: 36, target: google_apis }
          - { api: 36, target: google_apis_ps16k }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cargo install cargo-ndk --locked
      # Otherwise Gradle downloads the NDK inside the test run, after the marker below, where a
      # download failure would count as a test failure and not be retried.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' android/host/build.gradle.kts)
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" >/dev/null && exit 0
            sleep 20
          done
          exit 1
      # The runner sometimes fails before our tests start (a corrupt emulator download, a boot
      # timeout). The script's first act is a marker file, so "failed without the marker" means
      # infrastructure, and only then is the emulator set up once more. A failure of the tests
      # themselves is never retried.
      - id: devices
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: mkdir -p android/tests/reports && touch android/tests/reports/started && python3 android/tests/device_tests.py --device emulator-5554
      - name: Infrastructure retry (the emulator never got as far as the tests)
        id: retry
        if: steps.devices.outcome == 'failure' && hashFiles('android/tests/reports/started') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: mkdir -p android/tests/reports && touch android/tests/reports/started && python3 android/tests/device_tests.py --device emulator-5554
      - name: Device tests failed
        if: steps.devices.outcome == 'failure' && steps.retry.outcome != 'success'
        run: |
          echo "::error::device tests failed (see the device-report artifact)"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-report-${{ matrix.api }}-${{ matrix.target }}
          path: android/tests/reports/

  bindings:
    # Each ecosystem binding: its own build and smoke test, plus the Android libraries compiled
    # against the API (React Native, Capacitor, Flutter, Godot).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cargo install cargo-ndk --locked
      - name: React Native and Capacitor (TypeScript build + smoke test)
        run: |
          for b in react-native capacitor; do
            (cd bindings/$b && npm ci && npm run build && npm test)
          done
      - name: Flutter (unit tests)
        working-directory: bindings/flutter
        run: flutter pub get && flutter test
      - name: Unity (compiles against stub UnityEngine types; Unity itself needs a licence)
        run: dotnet build bindings/unity/Tests/Compile/Compile.csproj
      - name: C/CMake (install, then build and run a consumer)
        run: sh bindings/c/test.sh
      - name: Android libraries of the bindings
        working-directory: android
        run: >-
          ./gradlew -Pandysu.bindings=true :binding-react-native:assembleRelease :binding-capacitor:assembleRelease
          :binding-flutter:assembleRelease :binding-godot:assembleRelease

  packages:
    # The release packaging, published to a throwaway local site and installed from it by fresh
    # consumer projects: the same scripts the release runs against GitHub Pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cargo install cargo-ndk --locked && (python3 -c "import yaml" || sudo apt-get install -y python3-yaml)
      - name: Package into a local site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          # Serve the site from the start: `cargo package --registry andysu` reads its index.
          nohup python3 -m http.server 8765 --bind 127.0.0.1 -d "$RUNNER_TEMP/site" >/dev/null 2>&1 &
          cargo build --release -p andysu-cli
          mkdir -p dist/cli && cp target/release/andysu dist/cli/andysu-x86_64-unknown-linux-musl
          scripts/package.sh "$RUNNER_TEMP/site" http://127.0.0.1:8765
      - name: Install every package from it
        run: |
          curl -sf http://127.0.0.1:8765/index.html >/dev/null
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          scripts/verify-consumers.sh http://127.0.0.1:8765 "$version" dist/release cargo npm upm maven pub c godot

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s, seeded with the spec fixtures
        working-directory: core
        run: |
          for t in verify_and_parse parse_manifest; do
            mkdir -p fuzz/corpus/$t
            cp ../spec/fixtures/manifest/*/*.json fuzz/corpus/$t/
            cargo fuzz run $t fuzz/corpus/$t -- -max_total_time=60
          done
