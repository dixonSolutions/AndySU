# Tests on every branch push and pull request. Pushes to main run release.yml instead, which
# runs the same test jobs before publishing.
name: ci
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features andysu-core/jni,andysu-core/transport -- -D warnings
      - run: cargo test --workspace
      - name: C header is up to date
        run: |
          cargo install cbindgen --locked --version 0.29.4
          scripts/gen-header.sh
          git diff --exit-code core/include/andysu.h

  desktop-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make -C desktop test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cargo install cargo-ndk --locked
      - name: Build the host AAR for all ABIs, the API and the test APKs
        working-directory: android
        run: ./gradlew :api:assembleRelease :host:assembleRelease :payload-kit:assembleRelease --stacktrace

  android-devices:
    # The same driver as local runs (android/tests/device_tests.py) against CI emulators.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 24, target: default }
          - { api: 29, target: default }
          - { api: 31, target: aosp_atd }
          - { api: 34, target: aosp_atd }
          - { api: 36, target: google_apis }
          - { api: 36, target: google_apis_ps16k }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cargo install cargo-ndk --locked
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 android/tests/device_tests.py --device emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-report-${{ matrix.api }}-${{ matrix.target }}
          path: android/tests/reports/

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s, seeded with the spec fixtures
        working-directory: core
        run: |
          for t in verify_and_parse parse_manifest; do
            mkdir -p fuzz/corpus/$t
            cp ../spec/fixtures/manifest/*/*.json fuzz/corpus/$t/
            cargo fuzz run $t fuzz/corpus/$t -- -max_total_time=60
          done
